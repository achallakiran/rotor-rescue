function advance(dt){time+=dt;for(let b of boats){let nx=b.x+Math.sin(b.a)*b.speed*dt,nz=b.z+Math.cos(b.a)*b.speed*dt;if(ground(nx,nz)>0||Math.abs(nx)>125||Math.abs(nz)>125)b.a+=1.8*dt;else{b.x=nx;b.z=nz}}for(let c of cars){let d=c.axis==='x'?Math.sin(c.yaw):Math.cos(c.yaw);c[c.axis]+=d*3*dt;if(c[c.axis]>c.max||c[c.axis]<c.min){c[c.axis]=clamp(c[c.axis],c.min,c.max);c.yaw+=PI}c.y=ground(c.x,c.z)}if(mode==='play'){for(let [id,d] of [['up',1],['down',-1]])if(hold[id]>0){hold[id]-=dt;if(hold[id]<=0){altitude(d);hold[id]=.34}}updatePlayer(dt);updateEnemies(dt);updateProjectiles(dt);flash=Math.max(0,flash-dt*2.1);if(!locked){cam.x=ease(cam.x,player.x,4,dt);cam.y=ease(cam.y,player.y*.72,3,dt);cam.z=ease(cam.z,player.z+3,4,dt)}else{let pp=project(player.x,player.y+2,player.z);if(pp.y<35||pp.y>height-35){cam.y+=(clamp(pp.y,35,height-35)-pp.y)*2*half.y/height/.57236352}}if(ac&&rotGain){rotGain.gain.setTargetAtTime(.13+.035*Math.sin(time*TAU*8)+Math.hypot(player.vx,player.vz)*.001,ac.currentTime,.035);rotFilter.frequency.setTargetAtTime(160+(player.hp<30?90:0)+player.l*8,ac.currentTime,.1)}}else if(mode==='title'||mode==='help'){cam.x=-5+Math.sin(time*.075)*17;cam.z=14+Math.sin(time*.055)*13;cam.y=10}else if(ac&&rotGain)rotGain.gain.setTargetAtTime(.025,ac.currentTime,.12)}
worldGen();reset(false);show('title');let last=performance.now();function frame(now){let dt=clamp((now-last)/1000,0,.04);last=now;advance(dt);render();requestAnimationFrame(frame)}requestAnimationFrame(frame);
